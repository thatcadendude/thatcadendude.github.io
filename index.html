<html>
<head>
<title>thatcadendude: home</title>

<style>

body {
  background:black;
  animation:flicker 0.15s infinite;
  margin:0;
  padding:0;
}

@keyframes flicker {
  0% { opacity: 0.95; }
  50% { opacity: 1; }
  100% { opacity: 0.9; }
}

body::before {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9999;
  background:radial-gradient(
    ellipse at center,
    rgba(0,0,0,0) 55%,
    rgba(0,0,0,0.35) 75%,
    rgba(0,0,0,0.65) 100%
  );
  filter:blur(6px);
  transform:scale(1.1);
}

body::after {
  content:"";
  pointer-events:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;

  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0px,
    rgba(0,0,0,0) 2px,
    rgba(0,0,0,0.25) 3px
  );

  z-index:30000;
}

p,h1,#bootText {
  color:#04ff00;
  text-shadow: 0 0 2px #00ff41, 0 0 6px #00ff41, 0 0 12px #00ff41;
}

#boot {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  font-family:"lucida console","courier new",monospace;
  padding:40px;
  z-index:20000;
  animation:flicker 0.15s infinite;
  overflow:hidden;
}

#bootText {
  font-size:18px;
  white-space:pre;
  color:#00ff41;
}

</style>
</head>

<body>

<div id="boot">
  <pre id="bootText"></pre>
</div>

<script id="asciiData" type="text/plain">
|''||''| '||               ||    .|'''',             ||`                 '||'''|.              ||`
   ||     ||               ||    ||                  ||                   ||   ||              ||
   ||     ||''|,  '''|.  ''||''  ||       '''|.  .|''||  .|''|, `||''|,   ||   || '||  ||` .|''||  .|''|,
   ||     ||  || .|''||    ||    ||      .|''||  ||  ||  ||..||  ||  ||   ||   ||  ||  ||  ||  ||  ||..||
  .||.   .||  || `|..||.   `|..' `|....' `|..||. `|..||. `|...  .||  ||. .||...|'  `|..'|. `|..||. `|...
</script>

<script>
const boot = document.getElementById("bootText");

const ascii = document.getElementById("asciiData").textContent;

let ram = 0;
const maxRam = 8192;

function ramCount(){
  boot.textContent += "Memory Test: ";
  let counter = setInterval(()=>{
    boot.textContent = boot.textContent.replace(/Memory Test:.*/,"Memory Test: "+ram+"K");
    ram += 128;
    if(ram >= maxRam){
      clearInterval(counter);
      boot.textContent = boot.textContent.replace(/Memory Test:.*/,"Memory Test: "+maxRam+"K OK\n\n");
      setTimeout(startSequence, 400);
    }
  },20);
}

const sequence = [
  "Detecting IDE Drives...",
  "Drive 0: ST340014A [ OK ]",
  "Drive 1: None",
  "",
  "Initializing USB Controllers...",
  "USB Controller 1 [ OK ]",
  "USB Controller 2 [ OK ]",
  "",
  "Checking CMOS...",
  "CMOS Checksum [ FAILED ]",
  "Loading default settings...",
  "",
  "Initializing Hardware Monitor...",
  "CPU Fan [ OK ]",
  "System Temp [ OK ]",
  ""
];

let index = 0;

function startSequence(){
  if(index >= sequence.length){
    kernelPhase();
    return;
  }

  boot.textContent += sequence[index] + "\n";
  index++;

  setTimeout(startSequence, 120 + Math.random() * 180);
}

function kernelPhase(){
  boot.textContent += "\nLoading Kernel";

  setTimeout(()=> boot.textContent += ".", 300);
  setTimeout(()=> boot.textContent += ".", 600);
  setTimeout(()=> boot.textContent += ".", 900);

  setTimeout(()=>{
    boot.textContent += " [ OK ]\n";
  }, 1200);

  setTimeout(()=>{
    boot.textContent += "\nStarting services...\n";
  }, 1600);

  setTimeout(()=>{
    showAscii();
  }, 2200);
}

function showAscii(){
  boot.textContent += ascii + "\n";

  setTimeout(()=>{
    boot.textContent += "\nStarting cadenOS...\n";
  }, 1200);

  setTimeout(()=>{
    boot.textContent += "Boot successful.\n";
  }, 1800);

  setTimeout(()=>{
    window.location.href = "https://thatcadendude.github.io/home";
  }, 3500);
}

function startBoot(){
  boot.textContent += "cadenOS 4.0 Release 6.0\n";
  boot.textContent += "Copyright 2026 The Lads Innit Yeah Technologies Ltd. Co. Inc.\n\n";
  boot.textContent += "CPU: Kronium(R) Kronite Processor @ 3.50GHz\n\n";
  setTimeout(ramCount,400);
}

startBoot();
</script>
</body>
</html>
