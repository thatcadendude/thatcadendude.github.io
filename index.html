<html>
<head>
<title>thatcadendude: home</title>

<style>

body {
  background:black;
  animation:flicker 0.15s infinite;
  margin:0;
  padding:0;
}

body::before {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9999;
  background:radial-gradient(
    ellipse at center,
    rgba(0,0,0,0) 55%,
    rgba(0,0,0,0.35) 75%,
    rgba(0,0,0,0.65) 100%
  );
  filter:blur(6px);
  transform:scale(1.1);
}

body::after {
  content:"";
  pointer-events:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0px,
    rgba(0,0,0,0) 2px,
    rgba(0,0,0,0.25) 3px
  );
  z-index:999;
}

p,h1,#bootText {
  color:#04ff00;
  text-shadow: 0 0 2px #00ff41, 0 0 6px #00ff41, 0 0 12px #00ff41;
}

#boot {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  font-family:"lucida console","courier new",monospace;
  padding:40px;
  z-index:20000;
  animation:flicker 0.15s infinite;
  overflow:hidden;
}

#bootText {
  font-size:18px;
  white-space:pre;
  color:#00ff41;
}

ul{
  list-style-type:none;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#04ff00;
  position:fixed;
  top:0;
  width:100%;
}

li{
  float:left;
  border-right:1px solid black;
}

li a{
  display:block;
  color:black;
  font-family:"lucidia console","courier new",sans-serif;
  text-align:center;
  padding:14px 16px;
  text-decoration:none;
}

li a:hover:not(.active){
  background:black;
  color:#04ff00;
}

.active{
  background:black;
  color:#04ff00;
}

h1{
  font-family:"lucidia console","courier new",sans-serif;
  text-align:center;
  margin-top:60px;
}

p{
  font-family:"lucidia console","courier new",sans-serif;
  font-size:20px;
}
</style>
</head>

<body>

<div id="boot">
  <pre id="bootText"></pre>
</div>

<nav>
<ul>
<li><a href="https://thatcadendude.github.io">home</a></li>
<li><a href="https://thatcadendude.tumblr.com/">blog</a></li>
<li><a href="https://thatcadendude.github.io/about">about</a></li>
<li><a href="https://thatcadendude.github.io/projects">projects</a></li>
</ul>
</nav>

<h1>Main Page</h1>
<p>welcome to the home page (yes it's still called that).</p>

<script>
const boot = document.getElementById("bootText");

let ram = 0;
const maxRam = 8192;

function ramCount(){
  boot.textContent += "Memory Test: ";
  let counter = setInterval(()=>{
    boot.textContent = boot.textContent.replace(/Memory Test:.*/,"Memory Test: "+ram+"K");
    ram += 128;
    if(ram >= maxRam){
      clearInterval(counter);
      boot.textContent = boot.textContent.replace(/Memory Test:.*/,"Memory Test: "+maxRam+"K OK\n\n");
      setTimeout(startSequence, 400);
    }
  },20);
}

const ascii = `
  ::::::::::: :::    :::     ::: ::::::::::: ::::::::      :::     :::::::::  :::::::::: ::::    ::: :::::::::  :::    ::: :::::::::  ::::::::::
     :+:     :+:    :+:   :+: :+:   :+:    :+:    :+:   :+: :+:   :+:    :+: :+:        :+:+:   :+: :+:    :+: :+:    :+: :+:    :+: :+:
    +:+     +:+    +:+  +:+   +:+  +:+    +:+         +:+   +:+  +:+    +:+ +:+        :+:+:+  +:+ +:+    +:+ +:+    +:+ +:+    +:+ +:+
   +#+     +#++:++#++ +#++:++#++: +#+    +#+        +#++:++#++: +#+    +:+ +#++:++#   +#+ +:+ +#+ +#+    +:+ +#+    +:+ +#+    +:+ +#++:++#
  +#+     +#+    +#+ +#+     +#+ +#+    +#+        +#+     +#+ +#+    +#+ +#+        +#+  +#+#+# +#+    +#+ +#+    +#+ +#+    +#+ +#+
 #+#     #+#    #+# #+#     #+# #+#    #+#    #+# #+#     #+# #+#    #+# #+#        #+#   #+#+# #+#    #+# #+#    #+# #+#    #+# #+#
###     ###    ### ###     ### ###     ########  ###     ### #########  ########## ###    #### #########   ########  #########  ##########
`;

const sequence = [
  "Detecting IDE Drives...",
  "Drive 0: ST340014A [ OK ]",
  "Drive 1: None",
  "",
  "Initializing USB Controllers...",
  "USB Controller 1 [ OK ]",
  "USB Controller 2 [ OK ]",
  "",
  "Checking CMOS...",
  "CMOS Checksum [ FAILED ]",
  "Loading default settings...",
  "",
  "Initializing Hardware Monitor...",
  "CPU Fan [ OK ]",
  "System Temp [ OK ]",
  ""
];

let index = 0;

function startSequence(){
  if(index >= sequence.length){
    kernelPhase();
    return;
  }

  boot.textContent += sequence[index] + "\n";
  index++;

  setTimeout(startSequence, 120 + Math.random() * 180);
}

function kernelPhase(){
  boot.textContent += "\nLoading Kernel";

  setTimeout(()=> boot.textContent += ".", 300);
  setTimeout(()=> boot.textContent += ".", 600);
  setTimeout(()=> boot.textContent += ".", 900);

  setTimeout(()=>{
    boot.textContent += " [ OK ]\n";
  }, 1200);

  setTimeout(()=>{
    boot.textContent += "\nStarting services...\n";
  }, 1600);

  setTimeout(()=>{
    showAscii();
  }, 2200);
}

function showAscii(){
  boot.textContent += ascii + "\n";

  setTimeout(()=>{
    boot.textContent += "\nStarting OShit...\n";
  }, 1200);

  setTimeout(()=>{
    boot.textContent += "Boot successful.\n";
  }, 1800);

  setTimeout(()=>{
    document.getElementById("boot").style.display = "none";
  }, 2800);
}

function startBoot(){
  boot.textContent += "BIOShit 4.0 Release 6.0\n";
  boot.textContent += "Copyright 2026 Toilet Technologies Ltd. Co. Inc.\n\n";
  boot.textContent += "CPU: Shitel(R) Fentium Processor @ 3.50GHz\n\n";
  setTimeout(ramCount,400);
}

startBoot();
</script>
</body>
</html>
